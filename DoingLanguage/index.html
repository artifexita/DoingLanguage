<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoingLanguage — Progressive speech and language training for Apraxia and Aphasia rehabilitation">
  <meta name="theme-color" content="#3B82F6">
  <title>DoingLanguage — Speech &amp; Language Training</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/exercises.css">
</head>
<body>
  <!-- Skip to content link for keyboard users -->
  <a href="#app-content" class="skip-link">Skip to main content</a>

  <div class="app">
    <!-- Sidebar Navigation -->
    <aside class="app__sidebar" id="app-sidebar" aria-label="Navigation">
      <!-- Populated by app.js -->
    </aside>

    <!-- Header -->
    <header class="app__header">
      <div class="app__header-left">
        <button class="app__menu-toggle" id="menu-toggle" aria-label="Toggle navigation menu">
          ☰
        </button>
        <div>
          <div class="app__header-title">DoingLanguage</div>
          <div class="app__header-subtitle">Speech &amp; Language Training</div>
        </div>
      </div>
      <div class="app__header-right">
        <button class="btn btn--icon" id="btn-dashboard" title="Dashboard" aria-label="View dashboard">
          📊
        </button>
        <button class="btn btn--icon" id="btn-settings" title="Settings" aria-label="Open settings">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app__main" id="app-content" tabindex="-1">
      <!-- Loading state — replaced by app.js -->
      <div class="empty-state">
        <div class="spinner"></div>
        <div class="empty-state__title" style="margin-top: 1.5rem">Loading DoingLanguage…</div>
      </div>
    </main>

    <!-- Mobile overlay -->
    <div class="app__overlay" id="app-overlay" aria-hidden="true"></div>
  </div>

  <!-- Auto-clear old Service Worker caches to force immediate update -->
  <script>
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          if (k !== 'doing-language-v6') caches.delete(k);
        });
      });
    }
  </script>

  <!-- App script (ES module) with cache buster -->
  <script type="module" src="js/app.js?t=20260831_1440"></script>

  <!-- Register service worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?t=20260831_1440')
          .then(reg => {
            reg.update();
          })
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
